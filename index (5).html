<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioShift KZ: smart crop rotation and crop-stress detection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12261e;--panel:#1e3a2d;--line:#2f5642;--lime:#7ed957;--cream:#f4f1ea;--mute:#a9bdb0;--red:#c8392b;--amb:#e0a800;--grn:#2e7d32}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{font-size:22px}
.note{font-size:13px;color:var(--mute)}
.note b{color:var(--amb);font-weight:600}
main{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
#map{min-height:420px;background:#0d1c16}
aside{overflow:auto;padding:18px 20px;border-left:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:9px 10px;border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:8px;font:600 14px Inter,sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--lime);color:var(--ink);border-color:var(--lime)}
button:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:18px}
h2{font-size:22px;margin-bottom:2px}
.meta{color:var(--mute);margin:0 0 14px}
.box{background:var(--panel);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.box h3{font-size:15px;margin-bottom:8px}
.rec{font:700 22px "Space Grotesk",sans-serif;color:var(--lime);margin:4px 0}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chip{background:var(--ink);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px}
.why{margin-top:10px;width:100%;padding:9px;border-radius:8px;border:1px solid var(--lime);background:transparent;color:var(--lime);font:600 14px Inter,sans-serif;cursor:pointer}
.why[aria-expanded=true]{background:var(--lime);color:var(--ink)}
ul{margin:8px 0 0;padding-left:18px}
li{margin:3px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--mute)}dd{margin:0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.alert{border-left:4px solid var(--amb);padding-left:12px;margin:8px 0}
.alert.red{border-color:var(--red)}.alert.grn{border-color:var(--grn)}
.alert small{color:var(--mute)}
svg text{fill:var(--mute);font:11px Inter,sans-serif}
.leaflet-container{font:inherit}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid var(--line)}body{height:auto}html{height:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>BioShift KZ</h1>
  <p class="note" style="margin:0"><b>Prototype with sample data.</b> Pilot area: Almaty Region (Enbekshikazakh and Ili Districts). Real NASA data connection is planned.</p>
</header>
<main>
  <div id="map" aria-label="Map of sample fields in Almaty Region"></div>
  <aside>
    <div class="tabs" role="group" aria-label="Module">
      <button id="t1" aria-pressed="true">Land Booster</button>
      <button id="t2" aria-pressed="false">Anti-Stress Radar</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Sample data (illustrative, not real measurements) ----
const FIELDS=[
 {id:"E-01",district:"Enbekshikazakh District",ha:124,lat:43.405,lon:77.31,dLat:.022,dLon:.034,
  hist:["2024 spring barley","2025 sunflower","2026 spring wheat"],ndvi:[.61,.58,.55,.52,.49,.46],
  rec:"Legume crop → Winter wheat",desc:"Legumes can add soil nitrogen through biological nitrogen fixation, and the declining NDVI trend suggests lower productivity under cereals.",
  why:["MODIS NDVI peak fell from 0.61 to 0.46 over six seasons","SMAP regional soil moisture is below the 5-year average in spring","NASA POWER shows a drier-than-usual precipitation history","Farmer input: cereals grown in two of the last three years"],
  conf:{date:"2026-11-08",res:"MODIS 250 m",avail:"92% of expected scenes",level:"Medium"},
  zones:[["NW",0,"No significant anomaly",12],["NE",1,"Possible crop stress detected",48],["SW",1,"Possible crop stress detected",55],["SE",2,"Field inspection recommended",74]]},
 {id:"E-02",district:"Enbekshikazakh District",ha:86,lat:43.355,lon:77.50,dLat:.016,dLon:.026,
  hist:["2024 winter wheat","2025 winter wheat","2026 winter wheat"],ndvi:[.66,.64,.6,.57,.55,.5],
  rec:"Alfalfa or chickpea → Winter wheat",desc:"Three consecutive wheat crops raise the risk of disease and nutrient depletion. A break crop can help restore the rotation.",
  why:["Three years of the same crop in the field history","MODIS NDVI shows a steady downward trend","SMAP shows adequate regional moisture, so a legume is feasible","Farmer should confirm soil analysis before final choice"],
  conf:{date:"2026-11-06",res:"MODIS 250 m",avail:"88% of expected scenes",level:"Medium"},
  zones:[["NW",0,"No significant anomaly",9],["NE",0,"No significant anomaly",14],["SW",1,"Possible crop stress detected",41],["SE",0,"No significant anomaly",18]]},
 {id:"I-01",district:"Ili District",ha:152,lat:43.66,lon:76.95,dLat:.026,dLon:.04,
  hist:["2024 maize","2025 soybean","2026 maize"],ndvi:[.58,.6,.59,.61,.6,.62],
  rec:"Soybean → Winter wheat",desc:"The NDVI trend is stable, so the main goal is keeping nitrogen balance and spreading disease risk across crops.",
  why:["MODIS NDVI is stable across six seasons","Maize in 2026: soybean next season restores nitrogen","SMAP and NASA POWER show no severe dry periods","Irrigation access should be confirmed by the farmer"],
  conf:{date:"2026-11-10",res:"MODIS 250 m",avail:"95% of expected scenes",level:"High"},
  zones:[["NW",0,"No significant anomaly",6],["NE",0,"No significant anomaly",8],["SW",0,"No significant anomaly",11],["SE",1,"Possible crop stress detected",37]]}
];
const COL=["#2e7d32","#e0a800","#c8392b"];
const IRR=["No action needed","Check soil moisture before irrigating","Inspect the field first, then irrigate","" ];
const ECO={date:"2026-11-09",res:"ECOSTRESS 70 m",avail:"Partial: cloud-free passes only",level:"Medium"};

// ---- Map ----
const map=L.map("map",{minZoom:4,attributionControl:false}).setView([48.3,67.0],5);
const dark=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Tiles &copy; Esri"}).addTo(map);
const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Tiles &copy; Esri, Maxar, Earthstar Geographics"});
L.control.layers({"Dark map":dark,"Satellite":sat},null,{position:"topright",collapsed:false}).addTo(map);
// Simplified, approximate outline of Kazakhstan (schematic, not an official border)
const KZ=[[51.4,51.3],[51.0,54.0],[50.8,57.0],[51.0,60.0],[52.0,61.0],[54.0,61.7],[54.8,65.0],[54.9,68.5],[54.4,70.7],[55.4,73.3],[54.3,76.0],[52.0,80.0],[51.0,83.0],[50.7,87.3],[49.2,87.3],[47.1,85.5],[45.2,82.5],[44.8,80.2],[43.2,80.4],[42.2,80.2],[42.9,77.0],[42.8,75.0],[42.6,73.5],[43.0,71.5],[42.3,69.0],[42.8,67.0],[43.3,64.5],[44.2,61.5],[45.0,58.6],[44.5,56.0],[42.5,56.0],[41.4,55.0],[41.4,52.6],[42.7,51.2],[44.5,50.5],[46.5,49.0],[47.1,51.8],[49.0,46.8],[50.5,47.0]];
L.polygon(KZ,{color:"#7ed957",weight:2.5,fillColor:"#7ed957",fillOpacity:.12,interactive:false}).addTo(map);
L.marker([48.6,66.5],{opacity:0,interactive:false}).bindTooltip("KAZAKHSTAN",{permanent:true,direction:"center",className:"kz"}).addTo(map);
const KZB=[[40.9,46.5],[55.6,87.5]],PILOT=[[43.2,76.8],[43.8,77.7]];
const ctl=L.control({position:"topleft"});
ctl.onAdd=function(){const d=L.DomUtil.create("div","vbtns");d.innerHTML='<button id="vk">Kazakhstan</button><button id="va">Almaty Region</button>';L.DomEvent.disableClickPropagation(d);return d};
ctl.addTo(map);
document.getElementById("vk").onclick=()=>map.fitBounds(KZB);
document.getElementById("va").onclick=()=>map.fitBounds(PILOT);
map.fitBounds(KZB);

let mode=1,cur=null,layers=[];
function bounds(f){return[[f.lat,f.lon],[f.lat+f.dLat,f.lon+f.dLon]]}
function quad(f,q){const h=f.dLat/2,w=f.dLon/2,s=q[0].includes("S")?0:h,e=q[0].includes("E")?w:0;return[[f.lat+s,f.lon+e],[f.lat+s+h,f.lon+e+w]]}
function draw(){
  layers.forEach(l=>map.removeLayer(l));layers=[];
  const far=map.getZoom()<9;
  FIELDS.forEach(f=>{
    const sel=cur&&cur.id===f.id;
    if(far){
      layers.push(L.circleMarker([f.lat+f.dLat/2,f.lon+f.dLon/2],{radius:sel?10:8,color:"#f4f1ea",weight:2,fillColor:"#7ed957",fillOpacity:.95}).addTo(map).bindTooltip(f.id+" · "+f.district).on("click",()=>pick(f)));
      return;
    }
    if(mode===2){
      f.zones.forEach(z=>layers.push(L.rectangle(quad(f,z),{color:"#12261e",weight:1,fillColor:COL[z[1]],fillOpacity:.65}).addTo(map).on("click",()=>pick(f))));
      layers.push(L.rectangle(bounds(f),{color:sel?"#7ed957":"#f4f1ea",weight:sel?4:2,fill:false}).addTo(map));
    }else{
      layers.push(L.rectangle(bounds(f),{color:sel?"#7ed957":"#f4f1ea",weight:sel?4:2,fillColor:"#7ed957",fillOpacity:sel?.5:.28}).addTo(map).on("click",()=>pick(f)));
    }
    layers.push(L.marker([f.lat+f.dLat/2,f.lon+f.dLon/2],{opacity:0,interactive:false}).bindTooltip(f.id,{permanent:true,direction:"center",className:"lbl"}).addTo(map));
  });
}
function pick(f){cur=f;if(map.getZoom()<9)map.fitBounds(bounds(f),{maxZoom:12,padding:[60,60]});draw();render();}
function chart(v){
  const w=340,h=110,b=Math.floor(w/v.length),yrs=[2021,2022,2023,2024,2025,2026];
  return `<svg viewBox="0 0 ${w} ${h+18}" width="100%" role="img" aria-label="NDVI by season, sample data">${v.map((n,i)=>`<rect x="${i*b+8}" y="${h-n*150}" width="${b-16}" height="${n*150}" rx="3" fill="#7ed957" opacity="${.45+i*.1}"/><text x="${i*b+b/2}" y="${h+14}" text-anchor="middle">${yrs[i]}</text><text x="${i*b+b/2}" y="${h-n*150-4}" text-anchor="middle">${n.toFixed(2)}</text>`).join("")}</svg>`;
}
function confBox(c){return `<div class="box"><h3>Data confidence</h3><dl><dt>Latest observation</dt><dd>${c.date}</dd><dt>Spatial resolution</dt><dd>${c.res}</dd><dt>Data availability</dt><dd>${c.avail}</dd><dt>Confidence level</dt><dd>${c.level}</dd></dl></div>`}
function render(){
  const p=document.getElementById("panel"),f=cur;
  if(!f){p.innerHTML=`<div class="empty">Select a field on the map to see its ${mode===1?"crop rotation recommendation":"stress zones"}.</div>`;return}
  const head=`<h2>Field ${f.id}</h2><p class="meta">${f.district} · ${f.ha} ha</p>`;
  if(mode===1){
    p.innerHTML=head+`<div class="box"><h3>Crop history</h3><div class="hist">${f.hist.map(h=>`<span class="chip">${h}</span>`).join("")}</div></div>
    <div class="box"><h3>NDVI trend (sample)</h3>${chart(f.ndvi)}</div>
    <div class="box"><h3>Recommended rotation</h3><div class="rec">${f.rec}</div><p style="margin:4px 0 0">${f.desc}</p>
    <button class="why" id="why" aria-expanded="false" aria-controls="whyl">WHY?</button><ul id="whyl" hidden>${f.why.map(w=>`<li>${w}</li>`).join("")}</ul></div>
    ${confBox(f.conf)}<p class="note">Recommendations depend on local conditions, crop history and available soil information.</p>`;
    const b=document.getElementById("why"),l=document.getElementById("whyl");
    b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",!o);l.hidden=o};
  }else{
    const worst=Math.max(...f.zones.map(z=>z[1])),top=f.zones.slice().sort((a,b)=>b[3]-a[3])[0];
    p.innerHTML=head+`<div class="box"><h3>Zone status</h3>${f.zones.map(z=>`<div style="margin:5px 0"><span class="dot" style="background:${COL[z[1]]}"></span>${z[0]} zone: ${z[2]}${z[1]?` (${z[3]}%)`:""}</div>`).join("")}</div>
    <div class="box"><h3>Latest alert</h3><div class="alert ${["grn","","red"][worst]}">${worst===0?"No significant temperature anomaly detected in this field.":`Temperature anomaly detected in the ${top[0]} zone. Possible water stress: ${top[3]}%. ${IRR[worst]}.`}<br><small>Sample alert. Not a measurement.</small></div></div>
    <div class="box"><h3>Inputs</h3><ul style="margin:0"><li>ECOSTRESS: plant surface temperature anomalies</li><li>SMAP: regional soil moisture</li><li>GPM IMERG: regional precipitation</li></ul></div>
    ${confBox(ECO)}<p class="note">Satellite data gives estimates, not soil laboratory measurements. Inspect the field before acting.</p>`;
  }
}
function setMode(m){mode=m;t1.setAttribute("aria-pressed",m===1);t2.setAttribute("aria-pressed",m===2);draw();render()}
t1.onclick=()=>setMode(1);t2.onclick=()=>setMode(2);
const st=document.createElement("style");st.textContent=".lbl{background:#12261e;color:#f4f1ea;border:0;font-weight:600;box-shadow:none}.lbl:before{display:none}.kz{background:transparent;border:0;box-shadow:none;color:#7ed957;font:700 18px \"Space Grotesk\",sans-serif;letter-spacing:.35em;opacity:.8}.kz:before{display:none}.vbtns{display:flex;flex-direction:column;gap:4px}.vbtns button{background:#12261e;color:#f4f1ea;border:1px solid #2f5642;border-radius:6px;padding:6px 10px;font:600 13px Inter,sans-serif;cursor:pointer}.vbtns button:hover{background:#7ed957;color:#12261e}";document.head.appendChild(st);
map.on("zoomend",draw);
draw();render();
</script>
</body>
</html>
